<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div id="wrapper"> 
            <div class="loader"></div>
        </div>
        <div class="container">
            <h1> Professor <span class="mark">OS</span></h1>
            <p id="timeElement" style="color: aqua; background-color: black; font-size: medium;"></p>
        </div>
    </div>
    <div class="app">
        <div class="app-item">
            <img src="utilities/imgs/calculator.png" alt="Calculator">
            <p>Calculator</p>
        </div>

        <div class="app-item">
            <img src="utilities/imgs/CALENDAR.png" alt="Calendar">
            <p>Calendar</p>
        </div>

        <div class="app-item">
            <img src="utilities/imgs/paint.png" alt="Paint">
            <p>Paint</p>
        </div>

        <div class="app-item">
            <img src="utilities/imgs/Filefolder.png" alt="File Folder">
            <p>Files</p>
        </div>

        <div class="app-item">
            <img src="utilities/imgs/to-do list.jpg" alt="To-do List">
            <p>To-do List</p>
        </div>

        <div class="app-item">
            <img src="utilities/imgs/stopwatch.png" alt="Stopwatch">
            <p>Stopwatch</p>
        </div>
    </div>
 
    <script src="script.js"></script>
</body>
